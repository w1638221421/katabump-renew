名称: Katabump自动更新

对:
  附表:
  - cron: '30 19 */3 * *'  # 每天 UTC 22:30 (北京时间 6:30点) 运行,根据服务到期时间自行修改
  工作流调度: # 允许手动触发

工作:
  Renew-Katabump:
    接续的: 乌班图最新
    权限:
      内容: 写
      行动: 写
    
    步骤:
    - 使用: 操作/签出@v6
    - 名称: 请选择两种不同的语言
      使用: 操作/设置-python@v6
      与:
        蟒蛇型: '3.12'

    - 名称: 🛠️ 安装系统依赖和python依赖
      运行: |
        sudo apt-get更新
        sudo apt-get安装-y xvfb x11-实用程序xdotool scrot字体-通知-cjk
        pip安装seleniumbase请求
        基于硒安装铬驱动程序

    - 名称: 请选择两种不同的语言
      出错时继续: 真
      env:
        NODE_LINK: ${{ NODE_LINK： }}
      运行: |
        我的天啊，我的天啊！

    - 名称: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        # ===== 企业微信通知（两种方式任选其一）=====
        WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}          # 群机器人完整 webhook 地址
        WECOM_KEY: ${{ secrets.WECOM_KEY }}                  # 或者只填 webhook 的 key
        WECOM_MENTION_MOBILE: ${{ secrets.WECOM_MENTION_MOBILE }}  # 可选：@ 手机号，逗号分隔
        WECOM_CORPID: ${{ secrets.WECOM_CORPID }}            # 可选：自建应用 corpid
        WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}    # 可选：自建应用 secret
        WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}          # 可选：自建应用 agentid
        WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}            # 可选：接收人，默认 @all
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    # 更新时间到time.txt,避免90天未更新导致工作流暂停
    - name: 🕒 更新运行时间
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
        git add time.txt
        if git diff --cached --quiet; then
          echo "No need to commit"
        else
          git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
