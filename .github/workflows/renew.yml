name: Katabump Auto Renew

Date::
  Schedule::
  - cron: '30 19 */3 * *'  #Run daily at UTC 22:30 (Beijing Time 6:30), modify according to service expiration time
  workflow scheduling: #Allow manual triggering

Work::
  Renew-Katabump:
    The Latest Version of Ubuntu: Ubuntu Latest
    Access::
      Content: Written: 写
      Action: Write: 写
    
    Steps::
    - use: Action/Checkout@v6
    - Name: Programming Settings Python name: PLEASE SELECT TWO DISTINCT LANGUAGES
      use: Operation/Settings-python@v6
      Use::
        Python version: '3.12': '3.12'

    - name: Install system dependencies and python dependencies
      Running:|: |
        sudo apt-get update
        sudo apt-get install-y xvfb x11-utilities xdotool scrot fonts-notifications-cjk
        pip install seleniumbase request
        Selenium-based chrome driver installation

    - name: Please select two different languages
      continue on fault: 真
      env:
        NODE_LINK: ${{ NODE_LINK： }}
      operation: |
        Oh, my God! Oh, my God!

    - name: Run renewal script
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    # 更新时间到time.txt,避免90天未更新导致工作流暂停
    - name: 🕒 更新运行时间
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
        git add time.txt
        if git diff --cached --quiet; then
          echo "No need to commit"
        else
          git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
